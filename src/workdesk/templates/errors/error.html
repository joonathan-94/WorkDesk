<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{ status_code }} | WorkDesk</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="{{ url_for('static', filename='img/brand/favicon.svg') }}"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{{ url_for('static', filename='img/brand/favicon-32x32.png') }}"
    >

    <link
        rel="shortcut icon"
        href="{{ url_for('static', filename='img/brand/favicon.ico') }}"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="{{ url_for('static', filename='img/brand/apple-touch-icon.png') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/errors.css') }}"
    >
</head>

<body class="error-page">
    <main class="error-layout">
        <section class="error-card">
            <div class="error-code">
                {{ status_code }}
            </div>

            <h1 class="error-title">
                {{ title }}
            </h1>

            <p class="error-message">
                {{ message }}
            </p>

            <a
                class="error-link"
                href="{{ url_for('main.index') }}"
            >
                Volver al inicio
            </a>
        </section>
    </main>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Iniciar sesión | WorkDesk</title>
</head>

<body>
    <h1>WorkDesk</h1>

    <h2>Iniciar sesión</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >
        <div>
            <label for="username">Usuario</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >
        </div>

        <div>
            <label for="password">Contraseña</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>

        <button type="submit">
            Iniciar sesión
        </button>
    </form>
</body>
</html>

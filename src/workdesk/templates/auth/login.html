<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Iniciar sesión | WorkDesk</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >
</head>

<body class="auth-page">
    <main class="auth-layout">
        <div class="auth-container">
        <div class="login-brand">
            WorkDesk
        </div>

        <section
            class="login-card"
            aria-labelledby="login-title"
        >
            <header class="login-header">
                <h1
                    id="login-title"
                    class="login-title"
                >
                    Iniciar sesión
                </h1>

                <p class="login-description">
                    Ingresa tus credenciales para acceder a WorkDesk.
                </p>
            </header>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div
                            class="auth-alert auth-alert--{{ category }}"
                            role="alert"
                        >
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form
                class="login-form"
                method="post"
                action="{{ url_for('auth.login') }}"
            >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-field">
                    <label
                        class="form-label"
                        for="username"
                    >
                        Usuario
                        <span
                            class="required-mark"
                            aria-hidden="true"
                        >
                            *
                        </span>
                    </label>

                    <input
                        class="form-control"
                        id="username"
                        name="username"
                        type="text"
                        value="{{ request.form.get('username', '') }}"
                        autocomplete="username"
                        placeholder="Tu usuario"
                        required
                        autofocus
                    >
                </div>

                <div class="form-field">
                    <label
                        class="form-label"
                        for="password"
                    >
                        Contraseña
                        <span
                            class="required-mark"
                            aria-hidden="true"
                        >
                            *
                        </span>
                    </label>

                    <div class="password-field">
                        <input
                            class="form-control"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Tu contraseña"
                            required
                        >

                        <button
                            class="password-toggle"
                            id="password-toggle"
                            type="button"
                            aria-controls="password"
                            aria-pressed="false"
                            aria-label="Mostrar contraseña"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <button
                    class="login-submit"
                    type="submit"
                >
                    Iniciar sesión
                </button>
            </form>
        </section>
    </main>

    <script
        src="{{ url_for('static', filename='js/auth/login.js') }}"
    ></script>
</body>
</html>

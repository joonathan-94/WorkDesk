<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Dashboard | WorkDesk</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="{{ url_for('static', filename='img/brand/favicon.svg') }}"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{{ url_for('static', filename='img/brand/favicon-32x32.png') }}"
    >

    <link
        rel="shortcut icon"
        href="{{ url_for('static', filename='img/brand/favicon.ico') }}"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="{{ url_for('static', filename='img/brand/apple-touch-icon.png') }}"
    >
</head>

<body>
    <h1>WorkDesk</h1>

    <h2>Dashboard</h2>

    <p>
        Bienvenido,
        {{ current_user.nombre }} {{ current_user.apellido }}.
    </p>

    <p>
        Usuario: {{ current_user.username }}
    </p>

    <p>
        Rol: {{ current_user.rol.nombre }}
    </p>

    <form method="post" action="{{ url_for('auth.logout') }}">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <button type="submit">
            Cerrar sesión
        </button>
    </form>
</body>
</html>

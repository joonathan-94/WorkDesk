[pytest]
testpaths = tests
# Para que `pytest` (sin `python -m`) también encuentre `src` y `tests`.
pythonpath = .
addopts = --strict-markers
markers =
    unit: no usa la base de datos (se asigna sola; corre en segundos)
    platform: aplicación, rutas, layout, formato, comandos y auditoría
    auth: autenticación, sesiones, contraseñas, roles y «Mi cuenta»
    users: administración de usuarios
    groups: grupos, miembros y supervisores responsables
    knowledge: base de conocimiento (artículos, permisos, búsqueda)
    dashboards: dashboards por rol y carga de trabajo
    reports: reportes operativos, sus definiciones y la exportación a CSV y XLSX
    backups: respaldos de la base de datos y los adjuntos
    catalogs: catálogos de tickets, motivos de espera, estados y transiciones
    tickets: núcleo de tickets y su ciclo de vida
    sla: tiempo laboral, calendario, políticas y períodos de SLA
    notifications: notificaciones internas y los avisos por eventos
    seeds: comandos que cargan datos de demostración
